apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "novaroute.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "novaroute.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  config.json: |
    {
      "listen_socket": {{ .Values.agent.socketPath | quote }},
      "frr": {
        "socket_dir": "/run/frr",
        "connect_timeout": 10,
        "retry_interval": 5
      },
      "owners": {{ .Values.owners | default dict | toJson }},
      "log_level": {{ .Values.agent.logLevel | quote }},
      "metrics_address": ":{{ .Values.agent.metricsPort }}",
      "disconnect_grace_period": 30
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "novaroute.fullname" . }}-frr-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "novaroute.labels" . | nindent 4 }}
    app.kubernetes.io/component: frr-config
data:
  daemons: |
    # FRR daemon configuration -- enable the daemons NovaRoute needs.
    #
    # NovaRoute manages all configuration via the VTY Unix socket interface.
    # Each enabled daemon creates a <daemon>.vty socket in /run/frr/.
    bgpd={{ if .Values.frr.bgpd }}yes{{ else }}no{{ end }}
    ospfd={{ if .Values.frr.ospfd }}yes{{ else }}no{{ end }}
    ospf6d=no
    ripd=no
    ripngd=no
    isisd=no
    pimd=no
    pim6d=no
    ldpd=no
    nhrpd=no
    eigrpd=no
    babeld=no
    sharpd=no
    pbrd=no
    bfdd={{ if .Values.frr.bfdd }}yes{{ else }}no{{ end }}
    fabricd=no
    vrrpd=no
    pathd=no

    #
    # Zebra is always started and cannot be disabled.
    #

    # Management daemon.
    mgmtd=yes

    # Options for the daemons.
    mgmtd_options="--log syslog informational"
    zebra_options="-A 127.0.0.1 -s 90000000"
    bgpd_options="-A 127.0.0.1"
    ospfd_options="-A 127.0.0.1"
    bfdd_options="-A 0.0.0.0"

    # The FRR_DEFAULT_PROFILE sets the default configuration profile.
    # Use "datacenter" for data center deployments.
    frr_profile="datacenter"

    # Maximum number of FIB routes.
    MAX_FIB_ROUTES=1000000

    # watchfrr options -- restart daemons that crash.
    watchfrr_enable=yes
    watchfrr_options=""
  frr.conf: |
    ! FRR bootstrap configuration.
    ! NovaRoute manages runtime configuration via the VTY socket interface.
    ! This file provides minimal bootstrap settings.
    !
    frr version 10.5.1
    frr defaults datacenter
    !
    log syslog informational
    !
    ! No static configuration -- NovaRoute will configure BGP, BFD, and OSPF
    ! dynamically via the VTY Unix sockets.
    !
    line vty
    !
  vtysh.conf: |
    ! vtysh configuration
    service integrated-vtysh-config
