{{- if .Values.tests.smoke.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "novaroute.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "novaroute.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "novaroute.fullname" . }}-test
  labels:
    {{- include "novaroute.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "novaroute.fullname" . }}-test
  labels:
    {{- include "novaroute.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "novaroute.fullname" . }}-test
subjects:
  - kind: ServiceAccount
    name: {{ include "novaroute.fullname" . }}-test
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "novaroute.fullname" . }}-smoke-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "novaroute.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "novaroute.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: test
    spec:
      serviceAccountName: {{ include "novaroute.fullname" . }}-test
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: {{ .Values.tests.image | default "bitnami/kubectl:latest" }}
          command:
            - /bin/bash
            - -ec
            - |
              echo "=== NovaRoute Smoke Test ==="

              echo "1. Checking DaemonSet status..."
              kubectl rollout status daemonset/{{ include "novaroute.fullname" . }}-agent -n {{ .Release.Namespace }} --timeout=120s
              echo "   DaemonSet is ready"

              echo "2. Verifying agent pods are running..."
              PODS=$(kubectl get pods -n {{ .Release.Namespace }} -l app.kubernetes.io/component=agent --field-selector=status.phase=Running --no-headers | wc -l)
              if [ "$PODS" -lt 1 ]; then
                echo "FAIL: No agent pods running"
                kubectl get pods -n {{ .Release.Namespace }} -l app.kubernetes.io/component=agent
                exit 1
              fi
              echo "   $PODS agent pod(s) running"

              echo "3. Checking metrics service..."
              if kubectl get svc {{ include "novaroute.fullname" . }}-metrics -n {{ .Release.Namespace }} &>/dev/null; then
                echo "   Metrics service exists"
              else
                echo "FAIL: Metrics service not found"
                exit 1
              fi

              echo ""
              echo "=== Smoke Test PASSED ==="
{{- end }}
