name: Nightly Security Scan

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  trivy-fs:
    name: "Trivy Filesystem Scan"
    runs-on: arc-runner-novaroute
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run Trivy filesystem scan
        id: trivy_fs
        continue-on-error: true
        run: |
          trivy fs --severity CRITICAL,HIGH --exit-code 1 --format table --output trivy-fs-results.txt .
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Create or update issue on findings
        if: steps.trivy_fs.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Trivy Filesystem Scan: CRITICAL/HIGH vulnerabilities found"
          SCAN_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          RESULTS=$(cat trivy-fs-results.txt)
          BODY="## Trivy Filesystem Scan Results

          **Scan date:** ${SCAN_DATE}
          **Severity filter:** CRITICAL, HIGH

          \`\`\`
          ${RESULTS}
          \`\`\`

          This issue was automatically created by the nightly security scan."

          # Check for existing open issue
          EXISTING=$(gh issue list --label "security,trivy" --state open --search "$TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "security,trivy"
          fi

  trivy-images:
    name: "Trivy Container Image Scan"
    runs-on: arc-runner-novaroute
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build novaroute-agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: novaroute-agent:nightly-scan
          load: true

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run Trivy container scan
        id: trivy_image
        continue-on-error: true
        run: |
          trivy image --severity CRITICAL,HIGH --exit-code 1 --format table --output trivy-image-results.txt novaroute-agent:nightly-scan
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Create or update issue on findings
        if: steps.trivy_image.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Trivy Image Scan: CRITICAL/HIGH vulnerabilities in novaroute-agent"
          SCAN_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          RESULTS=$(cat trivy-image-results.txt)
          BODY="## Trivy Container Image Scan Results

          **Image:** novaroute-agent:nightly-scan
          **Scan date:** ${SCAN_DATE}
          **Severity filter:** CRITICAL, HIGH

          \`\`\`
          ${RESULTS}
          \`\`\`

          This issue was automatically created by the nightly security scan."

          # Check for existing open issue
          EXISTING=$(gh issue list --label "security,trivy" --state open --search "$TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "security,trivy"
          fi
