name: Continuous Testing (CT)

on:
  repository_dispatch:
    types: [deployment-complete]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        type: choice
        options:
          - all
          - integration
          - functional
          - performance
        default: all

permissions:
  contents: read
  checks: write

jobs:
  ct-functional:
    name: "CT: Functional Tests"
    runs-on: qnap-nas
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'functional'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install gotestsum
        run: GOTOOLCHAIN=auto go install gotest.tools/gotestsum@latest
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Run functional tests
        run: |
          CGO_ENABLED=1 gotestsum \
            --junitfile ct-functional-results.xml \
            --format pkgname \
            -- -race -tags=functional -count=1 ./...
      - name: Upload test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "CT: Functional Tests"
          path: ct-functional-results.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ct-functional-report
          path: ct-functional-results.xml
          retention-days: 30

  ct-integration:
    name: "CT: Integration Tests"
    runs-on: qnap-nas
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'integration'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install gotestsum
        run: GOTOOLCHAIN=auto go install gotest.tools/gotestsum@latest
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Run integration tests
        run: |
          CGO_ENABLED=1 gotestsum \
            --junitfile ct-integration-results.xml \
            --format pkgname \
            -- -race -tags=integration -count=1 -timeout=10m ./...
      - name: Upload test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "CT: Integration Tests"
          path: ct-integration-results.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ct-integration-report
          path: ct-integration-results.xml
          retention-days: 30

  ct-performance:
    name: "CT: Performance Tests"
    runs-on: qnap-nas
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'performance'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=3 -timeout=15m ./... | tee benchmark-results.txt
      - name: Generate summary
        if: always()
        run: |
          echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -n 500 benchmark-results.txt >> $GITHUB_STEP_SUMMARY
          TOTAL=$(wc -l < benchmark-results.txt)
          if [ "$TOTAL" -gt 500 ]; then
            echo "... (truncated, $TOTAL total lines — see artifact for full results)" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ct-performance-report
          path: benchmark-results.txt
          retention-days: 30

  ct-summary:
    name: "CT: Summary"
    runs-on: qnap-nas
    needs: [ct-functional, ct-integration, ct-performance]
    if: always()
    steps:
      - name: Generate CT summary
        run: |
          echo "## Continuous Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Functional | ${{ needs.ct-functional.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.ct-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.ct-performance.result }} |" >> $GITHUB_STEP_SUMMARY
