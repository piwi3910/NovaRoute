name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  packages: write

jobs:
  lint:
    name: Lint Code
    runs-on: arc-runner-novaroute
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run gofmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'gofmt -s -w .'"
            gofmt -s -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Check go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy'"
            git diff go.mod go.sum
            exit 1
          fi

  test:
    name: Unit Tests
    runs-on: arc-runner-novaroute
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests
        run: CGO_ENABLED=1 go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Display coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          echo "## Test Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build Binaries
    runs-on: arc-runner-novaroute
    strategy:
      matrix:
        binary:
          - name: novaroute-agent
            path: ./cmd/novaroute-agent/
          - name: novaroutectl
            path: ./cmd/novaroutectl/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build ${{ matrix.binary.name }}
        env:
          CGO_ENABLED: 0
        run: go build -v -ldflags="-s -w" -o bin/${{ matrix.binary.name }} ${{ matrix.binary.path }}

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.binary.name }}
          path: bin/${{ matrix.binary.name }}
          retention-days: 7

  docker-build:
    name: Docker Build Test
    runs-on: arc-runner-novaroute
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build novaroute-agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: novaroute-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: arc-runner-novaroute
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build-and-push:
    name: Build and Push Images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test, build, docker-build, security]
    runs-on: arc-runner-novaroute
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push novaroute-agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/piwi3910/novaroute-agent:sha-${{ github.sha }}
            ghcr.io/piwi3910/novaroute-agent:latest

  status-check:
    name: Status Check
    runs-on: arc-runner-novaroute
    needs: [lint, test, build, docker-build, security]
    if: always()
    steps:
      - name: Check all jobs status
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          results=(
            "$LINT_RESULT"
            "$TEST_RESULT"
            "$BUILD_RESULT"
            "$DOCKER_RESULT"
            "$SECURITY_RESULT"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "One or more jobs failed (found status: $r)"
              exit 1
            fi
          done
          echo "All jobs passed"
