name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/piwi3910/novaroute

jobs:
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        binary:
          - name: novaroute-agent
            path: ./cmd/novaroute-agent/
          - name: novaroutectl
            path: ./cmd/novaroutectl/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::8}"
          DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o "${{ matrix.binary.name }}-linux-${{ matrix.arch }}" \
            "${{ matrix.binary.path }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.binary.name }}-linux-${{ matrix.arch }}
          path: ${{ matrix.binary.name }}-linux-${{ matrix.arch }}
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-linux-*'

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "${dir}"* release/
          done
          chmod +x release/*
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true

  # Build per-platform images natively (no QEMU emulation).
  docker-build:
    name: Docker Build (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform pair
        id: platform
        run: echo "pair=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push agent
        id: agent-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/novaroute-agent,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agent-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,scope=agent-${{ steps.platform.outputs.pair }},mode=max

      - name: Build and push FRR
        id: frr-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frr
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/novaroute-frr,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=frr-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,scope=frr-${{ steps.platform.outputs.pair }},mode=max

      - name: Export digests
        run: |
          mkdir -p /tmp/digests/agent /tmp/digests/frr
          echo "${{ steps.agent-build.outputs.digest }}" > "/tmp/digests/agent/${{ steps.platform.outputs.pair }}"
          echo "${{ steps.frr-build.outputs.digest }}" > "/tmp/digests/frr/${{ steps.platform.outputs.pair }}"

      - name: Upload agent digest
        uses: actions/upload-artifact@v6
        with:
          name: agent-digest-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/agent/*
          retention-days: 1

      - name: Upload FRR digest
        uses: actions/upload-artifact@v6
        with:
          name: frr-digest-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/frr/*
          retention-days: 1

  # Merge per-platform images into multi-arch manifests.
  docker-manifest:
    name: Docker Manifest
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download agent digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/agent
          pattern: agent-digest-*
          merge-multiple: true

      - name: Download FRR digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/frr
          pattern: frr-digest-*
          merge-multiple: true

      - name: Extract agent metadata
        id: agent-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/novaroute-agent
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest

      - name: Create agent manifest
        working-directory: /tmp/digests/agent
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.agent-meta.outputs.json }}') \
            $(for f in *; do cat "$f" | xargs -I{} echo "${{ env.IMAGE_PREFIX }}/novaroute-agent@{}"; done)

      - name: Extract FRR metadata
        id: frr-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/novaroute-frr
          tags: |
            type=raw,value=10.5.1

      - name: Create FRR manifest
        working-directory: /tmp/digests/frr
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.frr-meta.outputs.json }}') \
            $(for f in *; do cat "$f" | xargs -I{} echo "${{ env.IMAGE_PREFIX }}/novaroute-frr@{}"; done)
