apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novaroute
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: agent=ghcr.io/piwi3910/novaroute-agent
    argocd-image-updater.argoproj.io/agent.update-strategy: latest
    argocd-image-updater.argoproj.io/agent.helm.image-name: agent.image.repository
    argocd-image-updater.argoproj.io/agent.helm.image-tag: agent.image.tag
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/piwi3910/NovaRoute
    path: charts/novaroute
    targetRevision: main
    helm:
      releaseName: novaroute
      valuesObject:
        agent:
          image:
            repository: ghcr.io/piwi3910/novaroute-agent
            tag: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: novaroute-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
