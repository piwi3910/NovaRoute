apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novaroute
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: operator=ghcr.io/piwi3910/novaroute/novaroute-operator
    argocd-image-updater.argoproj.io/operator.update-strategy: latest
    argocd-image-updater.argoproj.io/operator.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/operator.helm.image-tag: image.tag
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/piwi3910/NovaRoute
    path: charts/novaroute-operator
    targetRevision: main
    helm:
      releaseName: novaroute
      valuesObject:
        image:
          repository: ghcr.io/piwi3910/novaroute/novaroute-operator
          tag: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: novaroute-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
